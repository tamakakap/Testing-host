<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>For you the best part</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container" id="chat"></div>

<div class="ending" id="ending">
    <h1>some love stays.</h1>
    <p>even when people don’t.</p>
    <button id="loveBtn">tap here ♡</button>
</div>

<div class="love-screen" id="loveScreen"></div>

<script src="script.js"></script>
<!-- Efek Kembang Api Tanpa Ubah Kode Lama -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    // Kembang api otomatis meledak saat halaman dibuka
    window.addEventListener('load', () => {
        confetti({
            particleCount: 150,
            spread: 180,
            origin: { y: 0.6 }
        });
    });
</script>
</body>
</html>
