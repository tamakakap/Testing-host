<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>For you the best part</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container" id="chat"></div>

<div class="ending" id="ending">
    <h1>some love stays.</h1>
    <p>even when people don’t.</p>
    <button id="loveBtn">tap here ♡</button>
</div>

<div class="love-screen" id="loveScreen"></div>

<script src="script.js"></script>
<!-- Efek Kembang Api Terus-menerus Tanpa Ubah Kode Lama -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    // Kembang api akan meledak secara terus menerus setiap 1.5 detik
    window.addEventListener('load', () => {
        setInterval(() => {
            confetti({
                particleCount: 50,
                spread: 100,
                origin: { 
                    x: Math.random(), // Posisi horizontal acak (kiri ke kanan)
                    y: Math.random() - 0.2 // Posisi vertikal di sekitar atas/tengah layar
                }
            });
        }, 1500); // Angka 1500 artinya jeda 1.5 detik tiap ledakan (bisa diubah sesuai selera)
    });
</script>
</body>
</html>
